overrides:
  superstatic>re2: '-'
  '@webgpu/types': '-'
  'sass': '-'
patchedDependencies:
  pixi.js: patches/pixi.js.patch
  react-switch: patches/react-switch.patch
allowBuilds:
  argon2: true
  unrs-resolver: true
  core-js-pure: false

allowUnusedPatches: false
injectWorkspacePackages: true
minimumReleaseAge: 2880
nodeOptions: --no-warnings=ExperimentalWarning --experimental-vm-modules
autoInstallPeers: false
strictPeerDependencies: true
updateNotifier: false
verifyDepsBeforeRun: install
trustLockfile: true

packages:
  - pandora-common
  - pandora-server-directory
  - pandora-server-shard
  - pandora-client-web
  - pandora-api
  - pandora-cli
  - pandora-tests
minimumReleaseAgeExclude:
  # Renovate security update: react-router@8.3.0
  - react-router@8.3.0
  # Renovate security update: js-yaml@5.2.2
  - js-yaml@5.2.2
  # Renovate security update: nodemailer@9.1.1
  - nodemailer@9.1.1
